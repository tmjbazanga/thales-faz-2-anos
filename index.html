<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Álbum do Thales</title>
<meta name="theme-color" content="#1f6fb2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Álbum Thales">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
  :root {
    --fundo:#f6efe2; --card:#fffdf8; --texto:#163a5f; --suave:#5f7a93; --borda:#e7dcc6;
    --mar:#1f6fb2; --mar-escuro:#0f3d6e; --turquesa:#2bb3b1; --areia:#e8d3b0;
    --amarelo:#f6c744; --coral:#f07a4a; --ok:#2a9d6f;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--fundo); color:var(--texto);
    font:16px/1.45 "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1, h2, h3, .titulo { font-family:"Baloo 2", "Nunito", sans-serif; margin:0; line-height:1.05; }
  button, .btn { font:inherit; font-weight:800; min-height:48px; padding:0 18px; border:0; border-radius:14px;
    background:var(--mar); color:#fff; cursor:pointer; display:inline-flex; align-items:center;
    justify-content:center; gap:8px; text-decoration:none; }
  button:active, .btn:active { transform:scale(.98); }
  .btn.amarelo { background:var(--amarelo); color:var(--mar-escuro); }
  .btn.claro { background:#fff; color:var(--mar); border:2px solid var(--mar); }
  .btn.fantasma { background:transparent; color:var(--suave); font-weight:700; min-height:44px; }
  input, textarea { font:inherit; color:var(--texto); background:#fff; border:2px solid var(--borda);
    border-radius:14px; min-height:48px; padding:10px 14px; width:100%; outline:none; }
  input:focus, textarea:focus { border-color:var(--turquesa); }
  .esconder { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .aviso { background:#fff3cd; color:#7a5b00; border-radius:12px; padding:10px 14px; margin:12px 16px 0; font-size:14px; }

  /* ---------- Convidado ---------- */
  .hero { position:relative; overflow:hidden; color:#fff; text-align:center;
    background:linear-gradient(180deg, #2a8fc9 0%, var(--mar) 55%, var(--mar-escuro) 100%);
    padding: calc(env(safe-area-inset-top) + 18px) 16px 64px; }
  .hero img.thales { height:190px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.25)); position:relative; z-index:1; }
  .hero h1 { font-size:46px; font-weight:800; margin-top:6px; position:relative; z-index:1; text-shadow:0 3px 0 rgba(0,0,0,.15); }
  .hero .sub { font-family:"Baloo 2"; font-size:20px; font-weight:700; color:var(--amarelo); position:relative; z-index:1; }
  .hero p { margin:8px auto 0; max-width:320px; opacity:.92; position:relative; z-index:1; }
  .onda { position:absolute; left:0; right:0; bottom:-1px; height:46px; display:block; }
  .bolhas span { position:absolute; bottom:-30px; border-radius:50%; border:2px solid rgba(255,255,255,.55);
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), rgba(255,255,255,.05) 60%);
    animation:subir linear infinite; }
  @keyframes subir { from { transform:translateY(0) translateX(0); opacity:0; }
    10% { opacity:1; } to { transform:translateY(-110vh) translateX(20px); opacity:0; } }

  main.conv { max-width:560px; margin:-28px auto 0; padding:0 16px calc(env(safe-area-inset-bottom) + 28px); position:relative; z-index:2; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:20px; padding:16px; box-shadow:0 6px 20px rgba(15,61,110,.08); }
  .card + .card { margin-top:14px; }
  .rotulo { font-weight:800; font-size:14px; color:var(--suave); margin:0 0 6px; display:block; }
  .acoes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .acoes .btn { min-height:92px; flex-direction:column; font-size:16px; border-radius:18px; }
  .acoes .btn .emo { font-size:30px; line-height:1; }
  .nome-ok { display:flex; align-items:center; gap:8px; }
  .nome-ok b { flex:1; font-size:18px; }
  .fila { margin-top:12px; display:grid; gap:8px; }
  .fila:empty { display:none; }
  .fila .item { display:flex; align-items:center; gap:10px; background:#eef6fb; border-radius:12px; padding:6px 10px 6px 6px; font-size:14px; }
  .fila .item img { width:44px; height:44px; border-radius:8px; object-fit:cover; background:#cfe3f1; }
  .fila .item .txt { flex:1; }
  .fila .item.erro { background:#fdecea; }
  .barra { height:6px; border-radius:6px; background:#d4e6f3; overflow:hidden; margin-top:4px; }
  .barra i { display:block; height:100%; width:40%; background:var(--turquesa); border-radius:6px; animation:vai 1.2s ease-in-out infinite; }
  @keyframes vai { from { transform:translateX(-100%); } to { transform:translateX(260%); } }
  .abas { display:flex; gap:6px; background:#efe6d4; border-radius:14px; padding:4px; margin:20px 0 12px; }
  .abas button { flex:1; background:transparent; color:var(--suave); min-height:42px; border-radius:11px; }
  .abas button.ativa { background:#fff; color:var(--mar); box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .grade { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .ft { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; background:#dcebf5; border:0; padding:0; min-height:0; }
  .ft img { width:100%; height:100%; object-fit:cover; display:block; }
  .ft.erro::after { content:"🐚"; position:absolute; inset:0; display:grid; place-items:center; font-size:26px; }
  .ft .selo { position:absolute; left:4px; bottom:4px; right:4px; font-size:11px; font-weight:800; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
  .vazio { text-align:center; color:var(--suave); padding:24px 8px; }
  .rodape { text-align:center; margin-top:26px; font-size:14px; color:var(--suave); }
  .rodape a { color:var(--suave); }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%);
    background:var(--mar-escuro); color:#fff; padding:12px 18px; border-radius:14px; font-weight:700; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:90vw; text-align:center; }

  /* Visualizador */
  .lb { position:fixed; inset:0; z-index:40; background:rgba(6,24,44,.94); display:flex; flex-direction:column; }
  .lb .foto { flex:1; display:grid; place-items:center; padding:12px; min-height:0; }
  .lb .foto img { max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; }
  .lb .info { color:#fff; text-align:center; padding:0 16px 8px; }
  .lb .barraLb { display:flex; justify-content:space-between; padding:calc(env(safe-area-inset-top) + 8px) 8px 8px; }
  .lb .navLb { display:flex; gap:10px; justify-content:center; padding:8px 16px calc(env(safe-area-inset-bottom) + 14px); }
  .lb button { background:rgba(255,255,255,.14); }

  /* ---------- Telão ---------- */
  body.telao { background:#06223f; overflow:hidden; cursor:none; }
  .tl { position:fixed; inset:0; overflow:hidden; color:#fff;
    background:radial-gradient(ellipse at 50% 120%, #1f6fb2 0%, #0f3d6e 45%, #06223f 100%); }
  .tl .camada { position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease; }
  .tl .camada.vis { opacity:1; }
  .tl .camada .bg { position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(36px) brightness(.55) saturate(1.2); }
  .tl .camada .moldura { position:absolute; inset:15vh calc(6vw + clamp(150px, 15vw, 280px)) 19vh 4vw; display:grid; place-items:center; }
  .tl .camada .moldura img { max-width:100%; max-height:100%; object-fit:contain; border-radius:18px;
    border:10px solid #fffdf8; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .tl .camada.vis .moldura img { animation:zoom 12s ease-out forwards; }
  @keyframes zoom { from { transform:scale(1) rotate(-.6deg); } to { transform:scale(1.045) rotate(.4deg); } }
  .tl .legenda { position:absolute; left:4vw; bottom:2.5vh; max-width:62vw; }
  .tl .legenda .quem { font-family:"Baloo 2"; font-weight:800; font-size:clamp(22px, 3.2vw, 54px); text-shadow:0 3px 10px rgba(0,0,0,.5); }
  .tl .legenda .recado { font-size:clamp(16px, 1.9vw, 32px); opacity:.95; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .tl .nova { display:inline-block; background:var(--amarelo); color:var(--mar-escuro); font-weight:800; border-radius:99px;
    padding:4px 14px; font-size:clamp(14px, 1.4vw, 24px); margin-bottom:6px; animation:pulsa 1.2s ease-in-out infinite; }
  @keyframes pulsa { 50% { transform:scale(1.07); } }
  .tl .topo { position:absolute; left:4vw; top:3.2vh; z-index:3; display:flex; align-items:center; gap:14px; }
  .tl .topo img { height:clamp(60px, 9vh, 120px); filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .tl .topo .titulo { font-size:clamp(26px, 3.6vw, 64px); font-weight:800; text-shadow:0 3px 12px rgba(0,0,0,.45); }
  .tl .topo .titulo small { display:block; font-size:.45em; color:var(--amarelo); }
  .tl .qrbox { position:absolute; right:3vw; bottom:3vh; z-index:3; background:#fffdf8; color:var(--mar-escuro);
    border-radius:22px; padding:14px; text-align:center; box-shadow:0 14px 36px rgba(0,0,0,.4); width:clamp(150px, 15vw, 280px); }
  .tl .qrbox .qr img, .tl .qrbox .qr canvas { width:100% !important; height:auto !important; display:block; }
  .tl .qrbox b { font-family:"Baloo 2"; font-size:clamp(16px, 1.5vw, 28px); display:block; line-height:1.1; margin-top:8px; }
  .tl .qrbox small { font-size:clamp(11px, .9vw, 16px); color:var(--suave); }
  .tl .contador { position:absolute; right:3vw; top:3.2vh; z-index:3; font-weight:800; font-size:clamp(14px, 1.3vw, 24px);
    background:rgba(255,255,255,.14); padding:6px 14px; border-radius:99px; }
  .tl .vazioTl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:5vw; padding:4vw; z-index:2; }
  .tl .vazioTl img.thales { height:62vh; filter:drop-shadow(0 14px 24px rgba(0,0,0,.4)); }
  .tl .vazioTl .qrgrande { background:#fffdf8; border-radius:28px; padding:22px; width:min(34vw, 52vh); color:var(--mar-escuro); text-align:center; }
  .tl .vazioTl .qrgrande b { font-family:"Baloo 2"; font-size:clamp(22px, 2.6vw, 46px); display:block; line-height:1.05; margin-top:12px; }
  .tl .bolhas span { z-index:1; }
  .tl .iniciar { position:absolute; inset:0; z-index:10; display:grid; place-items:center; background:rgba(6,34,63,.7); cursor:pointer; }
  .tl .iniciar button { font-size:24px; min-height:72px; padding:0 34px; background:var(--amarelo); color:var(--mar-escuro); }
  .tl .sair { position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:11; opacity:0; transition:opacity .3s; cursor:pointer; }
  .tl:hover .sair { opacity:.8; }

  /* ---------- Pais ---------- */
  .topoPais { background:var(--mar); color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; gap:10px; }
  .topoPais h1 { font-size:24px; flex:1; }
  .topoPais .btn { background:rgba(255,255,255,.16); min-height:40px; }
  main.pais { max-width:900px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 28px); }
  .stats { display:flex; gap:10px; margin-bottom:14px; }
  .stats div { flex:1; background:var(--card); border:1px solid var(--borda); border-radius:16px; padding:12px; text-align:center; }
  .stats b { font-family:"Baloo 2"; font-size:30px; display:block; line-height:1; color:var(--mar); }
  .stats span { font-size:13px; color:var(--suave); font-weight:700; }
  .botoesPais { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:8px; margin-bottom:18px; }
  .gradePais { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .tp { background:var(--card); border:1px solid var(--borda); border-radius:14px; overflow:hidden; }
  .tp .ft { border-radius:0; width:100%; }
  .tp .rod { padding:6px 8px 8px; font-size:13px; }
  .tp .rod b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tp .rod .linha { display:flex; gap:6px; margin-top:6px; }
  .tp .rod button, .tp .rod a { flex:1; min-height:38px; font-size:13px; padding:0 6px; border-radius:10px; }
  .tp.oculta .ft img { opacity:.25; filter:grayscale(1); }
  .tp.oculta .ft::before { content:"Oculta no telão"; position:absolute; inset:auto 0 40% 0; text-align:center; font-weight:800; font-size:12px; color:var(--coral); z-index:1; }
  .login { max-width:360px; margin:40px auto; text-align:center; }
  .login img { height:150px; }
  .login form { display:grid; gap:10px; margin-top:12px; }

  /* ---------- QR para imprimir ---------- */
  .folha { max-width:720px; margin:0 auto; padding:24px 16px; }
  .cartao { background:#fff; border:3px dashed var(--turquesa); border-radius:28px; padding:28px 24px; text-align:center; }
  .cartao img.thales { height:170px; }
  .cartao h2 { font-size:38px; color:var(--mar); margin-top:6px; }
  .cartao p { font-size:18px; margin:6px 0 16px; }
  .cartao .qr { width:260px; margin:0 auto; }
  .cartao .qr img, .cartao .qr canvas { width:100% !important; height:auto !important; }
  .cartao .url { font-size:13px; color:var(--suave); margin-top:10px; word-break:break-all; }
  @media print { .naoimprime { display:none !important; } body { background:#fff; } .cartao { page-break-inside:avoid; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* CONFIG — cole aqui a URL do App da Web do Google Apps Script (termina em /exec) */
const CONFIG = {
  APP_NAME: 'Álbum do Thales',
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwVDfaGZ747bco9Pq2y8ej0G4EO4oNml_XVDoB6jaxlnIB-Ffvb60ITt4Rs57TANPOd/exec',
  TROCA_SEGUNDOS: 8,       // tempo de cada foto no telão
  ATUALIZA_SEGUNDOS: 15,   // de quanto em quanto tempo o telão busca fotos novas
  LADO_MAX: 2560,          // maior lado da foto enviada (px)
  QUALIDADE: 0.86,
  STORAGE_KEY: 'album-thales-v1'
};

/* ---------- utilidades ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const configurado = () => /^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL);
const linkConvidado = () => location.href.split('#')[0].split('?')[0];
const local = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY + ':' + k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(CONFIG.STORAGE_KEY + ':' + k, JSON.stringify(v)); } catch {} }
};
function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
const imgUrl = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const imgUrl2 = (id, w) => `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w}`;
function imgTag(id, w, extra = '', mini = '') {
  return `<img src="${imgUrl(id, w)}" data-id="${esc(id)}" data-w="${w}" ${mini ? `data-mini="${esc(mini)}"` : ''} loading="lazy" alt="" onerror="imgErro(this)" ${extra}>`;
}
function imgErro(el) {
  const f = +(el.dataset.f || 0); el.dataset.f = f + 1;
  if (f === 0) el.src = imgUrl2(el.dataset.id, el.dataset.w);
  else if (f === 1 && el.dataset.mini) el.src = el.dataset.mini;
  else { el.style.visibility = 'hidden'; el.parentElement?.classList.add('erro'); }
}
function bolhas(n) {
  let h = '<div class="bolhas" aria-hidden="true">';
  for (let i = 0; i < n; i++) {
    const s = 8 + Math.random() * 26, l = Math.random() * 100, d = 7 + Math.random() * 10, a = -Math.random() * 16;
    h += `<span style="width:${s}px;height:${s}px;left:${l}%;animation-duration:${d}s;animation-delay:${a}s"></span>`;
  }
  return h + '</div>';
}
const ONDA = `<svg class="onda" viewBox="0 0 1440 90" preserveAspectRatio="none"><path fill="#f6efe2" d="M0,40 C180,90 360,0 540,30 C720,60 900,90 1080,50 C1260,10 1350,30 1440,45 L1440,90 L0,90 Z"/></svg>`;
function qr(el, texto, tam = 512) {
  if (!el) return;
  const desenha = () => {
    if (!window.QRCode) return setTimeout(desenha, 300);
    el.innerHTML = '';
    new QRCode(el, { text: texto, width: tam, height: tam, colorDark: '#0f3d6e', colorLight: '#fffdf8', correctLevel: QRCode.CorrectLevel.M });
  };
  desenha();
}

/* ---------- comunicação com o script do Google ---------- */
async function apiGet(params = {}) {
  const q = new URLSearchParams({ ...params, _: Date.now() });
  const r = await fetch(CONFIG.SCRIPT_URL + '?' + q, { cache: 'no-store' });
  if (!r.ok) throw new Error('Servidor ' + r.status);
  const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Erro'); return j;
}
async function apiPost(obj) {
  // sem cabeçalho Content-Type → requisição simples (evita bloqueio de CORS)
  const r = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(obj) });
  if (!r.ok) throw new Error('Servidor ' + r.status);
  const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Erro'); return j;
}

/* ---------- fila de envio (guarda no aparelho até conseguir enviar) ---------- */
const Fila = {
  db: null,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('album-thales-fila', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('fila', { keyPath: 'chave' });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async op(modo, fn) {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const tx = db.transaction('fila', modo); const st = tx.objectStore('fila');
      const req = fn(st); tx.oncomplete = () => res(req?.result); tx.onerror = () => rej(tx.error);
    });
  },
  todos() { return this.op('readonly', st => st.getAll()).then(l => (l || []).sort((a, b) => a.criado - b.criado)); },
  por(item) { return this.op('readwrite', st => st.put(item)); },
  tirar(chave) { return this.op('readwrite', st => st.delete(chave)); }
};
let filaCache = [];

function carregarImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function lerBase64(blob) {
  return new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(blob); });
}
async function preparar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await carregarImg(url);
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    const k = Math.min(1, CONFIG.LADO_MAX / Math.max(w0, h0));
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const dados = c.toDataURL('image/jpeg', CONFIG.QUALIDADE).split(',')[1];
    const kt = 160 / Math.max(w, h); const t = document.createElement('canvas');
    t.width = Math.round(w * kt); t.height = Math.round(h * kt);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    return { mime: 'image/jpeg', dados, w, h, mini: t.toDataURL('image/jpeg', 0.7) };
  } catch {
    // formato que o navegador não abre (ex.: HEIC no Android): envia o arquivo original
    if (file.size > 15e6) throw new Error('Foto grande demais');
    return { mime: file.type || 'image/jpeg', dados: await lerBase64(file), w: 0, h: 0, mini: '' };
  } finally { URL.revokeObjectURL(url); }
}

async function adicionarFotos(files) {
  const nome = local.get('nome', '');
  const recado = ($('#recado')?.value || '').trim();
  let n = 0;
  for (const f of files) {
    if (!/^image\//.test(f.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) continue;
    try {
      const p = await preparar(f);
      await Fila.por({ chave: uid(), criado: Date.now() + n, nome, recado, tentativas: 0, ...p });
      n++;
    } catch (e) { toast('Não deu para abrir uma das fotos 😕'); }
  }
  if (!n) return;
  if ($('#recado')) $('#recado').value = '';
  await renderFila();
  processar();
}

let enviando = false, esperaRetry = null;
async function processar() {
  if (enviando || !configurado()) return;
  enviando = true; clearTimeout(esperaRetry);
  let falhou = false, enviadas = 0;
  try {
    for (;;) {
      const itens = await Fila.todos();
      const prox = itens.find(i => !i.pausada);
      if (!prox) break;
      prox.status = 'enviando'; filaCache = itens; desenharFila();
      try {
        const r = await apiPost({ acao: 'enviar', chave: prox.chave, nome: prox.nome, recado: prox.recado, mime: prox.mime, dados: prox.dados, w: prox.w, h: prox.h });
        const meus = local.get('meus', []); meus.unshift({ id: r.foto.id, t: r.foto.t, mini: prox.mini || '' }); local.set('meus', meus);
        await Fila.tirar(prox.chave); enviadas++;
      } catch (e) {
        prox.tentativas = (prox.tentativas || 0) + 1; prox.status = ''; prox.erro = navigator.onLine ? e.message : 'Sem internet';
        if (prox.tentativas >= 6 || /grande demais|vazia/i.test(e.message)) prox.pausada = true;
        await Fila.por(prox); falhou = true; break;
      }
    }
  } finally {
    enviando = false;
    await renderFila();
    if (enviadas) { toast(enviadas > 1 ? `${enviadas} fotos no álbum! 🐳` : 'Foto no álbum! 🐳'); renderGrade(); }
    if (falhou) esperaRetry = setTimeout(processar, 8000);
  }
}
window.addEventListener('online', processar);

/* visualizador de foto */
let lb = null;
function abrirLb(lista, i) { lb = { lista, i }; desenharLb(); }
function fecharLb() { lb = null; $('#lb')?.remove(); }
function desenharLb() {
  $('#lb')?.remove(); if (!lb) return;
  const f = lb.lista[lb.i];
  const d = document.createElement('div'); d.className = 'lb'; d.id = 'lb';
  d.innerHTML = `
    <div class="barraLb"><span></span><button data-lb="fechar" aria-label="Fechar">✕</button></div>
    <div class="foto" data-lb="fechar">${imgTag(f.id, 1600, 'loading="eager"')}</div>

    <div class="navLb"><button data-lb="ant" ${lb.i === 0 ? 'disabled' : ''}>‹ Anterior</button><button data-lb="prox" ${lb.i >= lb.lista.length - 1 ? 'disabled' : ''}>Próxima ›</button></div>`;
  document.body.appendChild(d);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lb]'); if (!b || !lb) return;
  if (b.dataset.lb === 'fechar' && (e.target === b || b.tagName === 'BUTTON')) fecharLb();
  if (b.dataset.lb === 'ant' && lb.i > 0) { lb.i--; desenharLb(); }
  if (b.dataset.lb === 'prox' && lb.i < lb.lista.length - 1) { lb.i++; desenharLb(); }
});
document.addEventListener('keydown', e => {
  if (!lb) return;
  if (e.key === 'Escape') fecharLb();
  if (e.key === 'ArrowLeft' && lb.i > 0) { lb.i--; desenharLb(); }
  if (e.key === 'ArrowRight' && lb.i < lb.lista.length - 1) { lb.i++; desenharLb(); }
});

async function iniciarTelao() {
  $('#iniciar')?.remove();
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.(); } catch {}
  manterAcesa();
  T.rodando = true;
  timers.push(setInterval(() => buscarTelao(false), CONFIG.ATUALIZA_SEGUNDOS * 1000));
  proximaFoto();
}
async function manterAcesa() {
  try { T.wake = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && T.rodando && location.hash === '#telao') manterAcesa(); });
async function buscarTelao(primeira) {
  if (!configurado()) return atualizarVazio();
  try {
    const r = await apiGet();
    const visiveis = new Set(r.fotos.map(f => f.id));
    T.fotos = r.fotos;
    T.ciclo = T.ciclo.filter(f => visiveis.has(f.id));   // tira fotos que os pais ocultaram
    T.novas = T.novas.filter(f => visiveis.has(f.id));
    for (const f of r.fotos) {
      if (T.conhecidas.has(f.id)) continue;
      T.conhecidas.add(f.id);
      if (!primeira) T.novas.push({ ...f, nova: true });
    }
  } catch {}
  atualizarVazio();
}
function atualizarVazio() {
  const tem = T.fotos.length > 0;
  if ($('#vazioTl')) $('#vazioTl').hidden = tem;
  if ($('#qrbox')) $('#qrbox').hidden = !tem;
  const c = $('#contador'); if (c) { c.hidden = !tem; c.textContent = `📸 ${T.fotos.length} ${T.fotos.length === 1 ? 'foto' : 'fotos'}`; }
  if (!tem) document.querySelectorAll('.camada').forEach(x => x.classList.remove('vis'));
}
function embaralhar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function proximaFoto() {
  if (!T.rodando || location.hash !== '#telao') return;
  let f = T.novas.shift();
  if (!f) {
    if (!T.ciclo.length) T.ciclo = embaralhar(T.fotos.slice());
    f = T.ciclo.shift();
  }
  if (!f) { timers.push(setTimeout(proximaFoto, 3000)); return; }
  const largura = Math.min(2560, Math.round(Math.max(screen.width, screen.height) * (devicePixelRatio || 1)));
  let src = imgUrl(f.id, largura);
  try { await carregarImg(src); }
  catch {
    src = imgUrl2(f.id, largura);
    try { await carregarImg(src); }
    catch {
      // foto recém-enviada: o Drive pode levar alguns segundos para gerar a imagem
      if (f.nova && (f.tent || 0) < 5) { f.tent = (f.tent || 0) + 1; T.novas.push(f); }
      timers.push(setTimeout(proximaFoto, 1500)); return;
    }
  }
  if (!T.rodando || location.hash !== '#telao') return;
  T.camada = 1 - T.camada;
  const el = $('#c' + T.camada), velho = $('#c' + (1 - T.camada));
  el.innerHTML = `
    <div class="bg" style="background-image:url('${src}')"></div>
    <div class="moldura"><img src="${src}" alt=""></div>
    <div class="legenda">
      ${f.nova ? '<div class="nova">✨ Foto nova!</div>' : ''}
      ${f.nome ? `<div class="quem">📸 ${esc(f.nome)}</div>` : ''}
      ${f.recado ? `<div class="recado">“${esc(f.recado)}”</div>` : ''}
    </div>`;
  requestAnimationFrame(() => { el.classList.add('vis'); velho.classList.remove('vis'); });
  timers.push(setTimeout(proximaFoto, CONFIG.TROCA_SEGUNDOS * 1000 + (f.nova ? 3000 : 0)));
}
