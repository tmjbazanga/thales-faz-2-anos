<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Álbum do Thales</title>
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Álbum Thales">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
  /* Paleta tirada da decoração: areia, azul-oceano, verde-água, marinho */
  :root {
    --bg:#f7f3ec; --card:#ffffff; --text:#17324d; --muted:#5e7387; --border:#e6ddcc;
    --accent:#1f6aa5; --accent-soft:#e3eff8; --mar:#6cc4c0; --areia:#e9dcc6; --sol:#f2c14e;
    --ok:#1e8e5a; --err:#c5221f; --sombra:0 10px 30px rgba(23,50,77,.12);
    --on-accent:#ffffff; --r:14px; --display:"Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1b2a; --card:#13263a; --text:#e9f0f6; --muted:#9fb2c4; --border:#22394f;
      --accent:#5aa9e6; --on-accent:#0d1b2a; --accent-soft:#1a3550; --areia:#2a3b4c; --sombra:0 10px 30px rgba(0,0,0,.4); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1, h2, .display { font-family:var(--display); font-weight:600; margin:0; line-height:1.1; letter-spacing:-.01em; }
  svg.i { width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .esconder { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  /* botões */
  button, .btn { font:inherit; font-weight:600; min-height:48px; padding:0 18px; border:1px solid transparent; border-radius:var(--r);
    background:var(--accent); color:var(--on-accent); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    gap:8px; text-decoration:none; transition:transform .15s, background .15s, opacity .15s; }
  button:active, .btn:active { transform:scale(.97); }
  button:disabled { opacity:.45; }
  .btn-sec { background:var(--card); color:var(--accent); border-color:var(--border); }
  .btn-txt { background:transparent; color:var(--accent); padding:0 8px; min-height:44px; }
  .btn-icone { width:44px; min-height:44px; padding:0; background:transparent; color:var(--muted); }
  input, textarea { font:inherit; font-size:16px; color:var(--text); background:var(--card); border:1px solid var(--border);
    border-radius:12px; min-height:48px; padding:12px 14px; width:100%; outline:none; transition:border-color .15s, box-shadow .15s; }
  textarea { resize:none; min-height:84px; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .field { display:grid; gap:6px; }
  .field label { font-size:14px; font-weight:600; }
  .field .hint { font-size:12px; color:var(--muted); }
  .aviso { background:#fff4d6; color:#6b4e00; border-radius:12px; padding:12px 14px; margin:16px; font-size:14px; }

  /* ---------- Convidado ---------- */
  .topo { position:relative; isolation:isolate; text-align:center; padding:calc(env(safe-area-inset-top) + 24px) 16px 8px; overflow:hidden; }
  .topo::before { content:""; position:absolute; inset:0 0 auto; height:210px; z-index:-1;
    background:linear-gradient(180deg, var(--accent-soft), transparent); }
  .ondas { position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 64px); width:100%; height:60px; z-index:-1; opacity:.6; }
  .vigia { width:132px; height:132px; margin:0 auto; border-radius:50%; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 30%, #f4fafd, #c7e4f3 70%); border:6px solid var(--card);
    box-shadow:0 0 0 1px var(--border), var(--sombra); }
  .vigia img { position:absolute; left:50%; top:9%; width:86%; transform:translateX(-50%); }
  .topo h1 { font-size:30px; margin-top:16px; }
  .topo .data { font-size:14px; color:var(--muted); margin-top:4px; display:flex; gap:8px; justify-content:center; align-items:center; }
  .topo .data i { width:4px; height:4px; border-radius:50%; background:var(--mar); }
  .topo p { margin:12px auto 0; max-width:300px; color:var(--muted); font-size:15px; }

  main.conv { max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 112px); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:16px; }
  .card + .card { margin-top:12px; }
  .quem { display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:grid; place-items:center; font-weight:600; font-size:16px; flex:none; }
  .quem .txt { flex:1; min-width:0; font-size:14px; color:var(--muted); }
  .quem .txt b { display:block; color:var(--text); font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .linhaNome { display:flex; gap:8px; }
  .linhaNome button { flex:none; }
  .recado { margin-top:12px; border-top:1px solid var(--border); padding-top:4px; }
  .recado > button { width:100%; justify-content:flex-start; padding:0; color:var(--accent); background:transparent; }
  .recado .field { margin-top:4px; }

  .fila { margin-top:12px; display:grid; gap:8px; }
  .fila:empty { display:none; }
  .fila .item { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:8px 8px 8px 8px; font-size:14px; }
  .fila .item img, .fila .item .ph { width:48px; height:48px; border-radius:10px; object-fit:cover; background:var(--accent-soft); flex:none; }
  .fila .item .txt { flex:1; min-width:0; }
  .fila .item.erro { border-color:#f1c4c1; }
  .fila .item.erro .txt { color:var(--err); }
  .barra { height:4px; border-radius:4px; background:var(--accent-soft); overflow:hidden; margin-top:8px; }
  .barra i { display:block; height:100%; width:35%; background:var(--accent); border-radius:4px; animation:vai 1.1s ease-in-out infinite; }
  @keyframes vai { from { transform:translateX(-100%); } to { transform:translateX(290%); } }

  .seg { display:flex; gap:4px; background:var(--areia); border-radius:var(--r); padding:4px; margin:24px 0 12px; }
  .seg button { flex:1; white-space:nowrap; background:transparent; color:var(--muted); min-height:44px; border-radius:11px; font-size:15px; }
  .seg button[aria-selected=true] { background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(23,50,77,.12); }
  .seg .n { font-size:12px; font-weight:600; color:var(--muted); background:var(--bg); border-radius:99px; padding:1px 8px; }
  .grade { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; border-radius:16px; overflow:hidden; }
  .ft { position:relative; aspect-ratio:1; overflow:hidden; background:var(--accent-soft); border:0; padding:0; min-height:0; border-radius:0; }
  .ft img { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .25s; }
  .ft.erro::after { content:""; position:absolute; inset:35%; border-radius:50%; border:2px solid var(--border); }
  .ft .selo { position:absolute; inset:auto 0 0; padding:16px 6px 5px; font-size:11px; font-weight:600; color:#fff; text-align:left;
    background:linear-gradient(transparent, rgba(10,25,40,.6)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vazio { text-align:center; color:var(--muted); padding:32px 16px; border:1px dashed var(--border); border-radius:20px; font-size:15px; }
  .vazio svg { width:56px; height:56px; stroke:var(--mar); stroke-width:1.4; fill:none; display:block; margin:0 auto 8px; }
  .rodape { text-align:center; margin-top:32px; font-size:13px; color:var(--muted); }
  .rodape a { color:var(--muted); text-decoration:none; border-bottom:1px solid var(--border); padding:8px 0; }

  .acao { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--border); }
  .acao .in { max-width:560px; margin:0 auto; display:grid; grid-template-columns:1.6fr 1fr; gap:8px; }
  .acao .btn { min-height:56px; font-size:16px; border-radius:16px; }
  .acao .btn:first-child { box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }

  .toast { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 96px); z-index:60; max-width:520px; margin:0 auto;
    background:#17324d; color:#fff; border-radius:14px; padding:12px 16px; display:flex; gap:12px; justify-content:space-between; align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.25); animation:sobe .2s ease-out; font-size:15px; }
  .toast button { background:transparent; color:#9fd3ff; min-height:36px; padding:0 4px; }
  body.sem-barra .toast { bottom:calc(env(safe-area-inset-bottom) + 20px); }
  @keyframes sobe { from { transform:translateY(12px); opacity:0; } }

  /* Visualizador */
  .lb { position:fixed; inset:0; z-index:50; background:#081421; display:flex; flex-direction:column; color:#fff; animation:aparece .2s; }
  @keyframes aparece { from { opacity:0; } }
  .lb .barraLb { display:flex; justify-content:space-between; align-items:center; padding:calc(env(safe-area-inset-top) + 8px) 8px 8px 16px; font-size:14px; color:#b9c7d4; }
  .lb .barraLb button { color:#fff; }
  .lb .foto { flex:1; display:grid; place-items:center; padding:0 12px; min-height:0; }
  .lb .foto img { max-width:100%; max-height:100%; object-fit:contain; border-radius:12px; }
  .lb .info { text-align:center; padding:16px 24px 4px; min-height:64px; }
  .lb .info b { font-family:var(--display); font-weight:600; font-size:20px; display:block; }
  .lb .info span { color:#c9d6e2; }
  .lb .navLb { display:flex; gap:8px; justify-content:center; padding:8px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .lb .navLb button { background:rgba(255,255,255,.1); min-width:120px; }

  /* ---------- Telão ---------- */
  body.telao { background:#071a2c; overflow:hidden; cursor:none; }
  .tl { position:fixed; inset:0; overflow:hidden; color:#fff; background:linear-gradient(180deg, #0f3554 0%, #0a2540 55%, #071a2c 100%); }
  .tl .luz { position:absolute; inset:-20%; opacity:.5; pointer-events:none;
    background:radial-gradient(40% 30% at 30% 0%, rgba(108,196,192,.35), transparent 70%),
               radial-gradient(35% 28% at 75% 5%, rgba(90,169,230,.3), transparent 70%);
    animation:luz 18s ease-in-out infinite alternate; }
  @keyframes luz { to { transform:translateX(6%) translateY(3%); } }
  .bolhas span { position:absolute; bottom:-30px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35);
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%); animation:subir linear infinite; }
  @keyframes subir { from { transform:translateY(0); opacity:0; } 10% { opacity:1; } to { transform:translateY(-110vh) translateX(16px); opacity:0; } }
  .tl .palco { position:absolute; inset:15vh calc(7vw + clamp(160px, 15vw, 280px)) 5vh 4vw; }
  .tl .camada { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity 1.2s ease; }
  .tl .camada.vis { opacity:1; }
  .tl .polaroid .nova { color:#fff; }
  .polaroid { background:#fffdf8; color:#17324d; padding:1.4vh 1.4vh 0; border-radius:6px; box-shadow:0 24px 60px rgba(0,0,0,.45);
    display:flex; flex-direction:column; max-width:100%; max-height:100%; transform:rotate(var(--rot, 0deg)); }
  .tl .camada.vis .polaroid { animation:flutua 10s ease-out forwards; }
  @keyframes flutua { from { transform:rotate(var(--rot)) scale(.97); } to { transform:rotate(var(--rot)) scale(1.01); } }
  .polaroid img { display:block; max-width:100%; max-height:calc(80vh - 15vh - 2vh); object-fit:contain; border-radius:2px; min-height:0; }
  .polaroid .leg { padding:1.6vh .6vh 2vh; display:flex; align-items:baseline; gap:1.2vw; min-height:9vh; }
  .polaroid .leg .nome { font-family:var(--display); font-weight:600; font-size:clamp(20px, 2.4vw, 46px); white-space:nowrap; }
  .polaroid .leg .msg { font-size:clamp(14px, 1.4vw, 28px); color:#5e7387; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .polaroid .leg .nova { font-size:clamp(12px, 1vw, 20px); font-weight:600; color:#fff; background:#1f6aa5; padding:.3em .8em; border-radius:99px; white-space:nowrap; }
  .tl .marca { position:absolute; left:4vw; top:4vh; display:flex; align-items:center; gap:1.2vw; z-index:3; }
  .tl .marca .vigia { width:clamp(64px, 7vw, 130px); height:clamp(64px, 7vw, 130px); border-width:4px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .tl .marca h1 { font-size:clamp(26px, 3vw, 58px); }
  .tl .marca small { display:block; font-size:clamp(13px, 1.2vw, 22px); color:#a9c3d8; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight:400; margin-top:.3em; }
  .tl .contador { position:absolute; right:3vw; top:4.5vh; z-index:3; font-size:clamp(13px, 1.1vw, 22px); color:#cfe0ee;
    border:1px solid rgba(255,255,255,.2); padding:.5em 1em; border-radius:99px; }
  .tl .qrbox { position:absolute; right:3vw; bottom:5vh; z-index:3; width:clamp(160px, 15vw, 280px); background:#fffdf8; color:#17324d;
    border-radius:20px; padding:clamp(12px, 1.2vw, 22px); text-align:center; box-shadow:0 18px 40px rgba(0,0,0,.4); }
  .tl .qrbox .qr img, .tl .qrbox .qr canvas, .qrPrint img, .qrPrint canvas, .qrG img, .qrG canvas { width:100% !important; height:auto !important; display:block; }
  .tl .qrbox b { font-family:var(--display); font-weight:600; font-size:clamp(17px, 1.6vw, 30px); display:block; margin-top:.6em; line-height:1.1; }
  .tl .qrbox small { font-size:clamp(11px, .85vw, 16px); color:#5e7387; }
  .tl .vazioTl { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; gap:6vw; padding:6vw; }
  .tl .vazioTl .txt h2 { font-size:clamp(32px, 4vw, 76px); max-width:12ch; }
  .tl .vazioTl .txt p { font-size:clamp(16px, 1.6vw, 30px); color:#a9c3d8; margin:1em 0 0; max-width:22ch; }
  .tl .vazioTl .qrG { width:min(30vw, 50vh); background:#fffdf8; padding:2vw; border-radius:28px; box-shadow:0 18px 50px rgba(0,0,0,.4); }
  .tl .iniciar { position:absolute; inset:0; z-index:10; display:grid; place-items:center; background:rgba(7,26,44,.75); cursor:pointer; }
  .tl .iniciar .caixa { text-align:center; }
  .tl .iniciar button { font-size:22px; min-height:64px; padding:0 32px; margin-top:20px; }
  .tl .iniciar p { color:#a9c3d8; margin:12px 0 0; }
  .tl .sair { position:absolute; left:50%; top:12px; transform:translateX(-50%); z-index:11; opacity:0; transition:opacity .3s; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; min-height:40px; }
  .tl:hover .sair { opacity:1; }

  /* ---------- Pais ---------- */
  .cab { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px; background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); padding:calc(env(safe-area-inset-top) + 8px) 8px 8px 16px; border-bottom:1px solid var(--border); }
  .cab h1 { font-size:20px; flex:1; }
  main.pais { max-width:960px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 32px); }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .kpis > div { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:12px; }
  .kpi { font-size:28px; font-weight:600; line-height:1; }
  .kpi-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:6px; }
  .acoesPais { display:grid; gap:8px; margin:16px 0 8px; }
  .acoesPais .linha { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .acoesPais .linha .btn { flex-direction:column; gap:4px; min-height:72px; font-size:13px; padding:8px; text-align:center; }
  .group-title { font-size:12px; color:var(--muted); margin:24px 4px 8px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; display:flex; justify-content:space-between; align-items:center; }
  .chips { display:flex; gap:8px; }
  .chip { min-height:36px; padding:0 14px; border-radius:18px; background:var(--card); color:var(--text); border:1px solid var(--border); font-size:14px; font-weight:600; text-transform:none; letter-spacing:0; }
  .chip[aria-pressed=true] { background:var(--text); color:var(--bg); border-color:var(--text); }
  .gradePais { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .tp { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  .tp .ft { width:100%; display:block; }
  .tp .rod { display:flex; align-items:center; gap:4px; padding:6px 4px 6px 12px; }
  .tp .rod .txt { flex:1; min-width:0; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tp .rod .txt b { display:block; color:var(--text); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tp .rod .btn-icone { width:40px; min-height:40px; }
  .tp.oculta .ft img { opacity:.3; filter:grayscale(1); }
  .tp.oculta .ft::before { content:"Oculta"; position:absolute; left:8px; top:8px; z-index:1; font-size:12px; font-weight:600;
    background:var(--text); color:var(--bg); padding:2px 8px; border-radius:99px; }
  .login { max-width:340px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 48px) 16px 32px; text-align:center; }
  .login h1 { font-size:26px; margin-top:16px; }
  .login p { color:var(--muted); margin:6px 0 24px; font-size:15px; }
  .login form { display:grid; gap:12px; text-align:left; }
  .login input { text-align:center; font-size:22px; letter-spacing:.3em; }

  /* ---------- Cartão do QR ---------- */
  .folha { max-width:640px; margin:0 auto; padding:16px; }
  .cartao { background:#fffdf8; color:#17324d; border:1px solid #e6ddcc; border-radius:28px; padding:40px 32px; text-align:center; position:relative; overflow:hidden; }
  .cartao::before { content:""; position:absolute; inset:0 0 auto; height:140px; background:linear-gradient(180deg, #e3eff8, transparent); }
  .cartao > * { position:relative; }
  .cartao h2 { font-size:clamp(30px, 8vw, 40px); margin-top:16px; }
  .cartao .sub { color:#5e7387; margin:4px 0 0; }
  .cartao .passo { font-size:18px; margin:20px auto 20px; max-width:28ch; }
  .qrPrint { width:240px; margin:0 auto; padding:14px; background:#fff; border-radius:18px; border:1px solid #e6ddcc; }
  .cartao .url { font-size:12px; color:#5e7387; margin-top:16px; word-break:break-all; }
  @media print {
    .naoimprime { display:none !important; }
    html, body { background:#fff !important; }
    .cartao { border:1.5px dashed #6cc4c0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* CONFIG — cole aqui a URL do App da Web do Google Apps Script (termina em /exec) */
const CONFIG = {
  APP_NAME: 'Álbum do Thales',
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwVDfaGZ747bco9Pq2y8ej0G4EO4oNml_XVDoB6jaxlnIB-Ffvb60ITt4Rs57TANPOd/exec',
  DATA_FESTA: '7 de novembro',
  TROCA_SEGUNDOS: 8,       // tempo de cada foto no telão
  ATUALIZA_SEGUNDOS: 15,   // de quanto em quanto tempo o telão busca fotos novas
  LADO_MAX: 2560,          // maior lado da foto enviada (px)
  QUALIDADE: 0.86,
  STORAGE_KEY: 'album-thales-v1'
};

/* ---------- utilidades ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function toast(msg, desfazer, ms = 3200) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (desfazer ? '<button>Desfazer</button>' : '');
  if (desfazer) t.querySelector('button').onclick = () => { desfazer(); t.remove(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), desfazer ? 5000 : ms);
}
const imgUrl = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const imgUrl2 = (id, w) => `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w}`;
function imgTag(id, w, extra = '', mini = '') {
  return `<img src="${imgUrl(id, w)}" data-id="${esc(id)}" data-w="${w}" ${mini ? `data-mini="${esc(mini)}"` : ''} loading="lazy" alt="" onerror="imgErro(this)" ${extra}>`;
}
function imgErro(el) {
  const f = +(el.dataset.f || 0); el.dataset.f = f + 1;
  if (f === 0) el.src = imgUrl2(el.dataset.id, el.dataset.w);
  else if (f === 1 && el.dataset.mini) el.src = el.dataset.mini;
  else { el.style.opacity = '0'; el.parentElement?.classList.add('erro'); }
}
function bolhas(n) {
  let h = '<div class="bolhas" aria-hidden="true">';
  for (let i = 0; i < n; i++) {
    const s = 6 + Math.random() * 22, l = Math.random() * 100, d = 9 + Math.random() * 12, a = -Math.random() * 20;
    h += `<span style="width:${s}px;height:${s}px;left:${l}%;animation-duration:${d}s;animation-delay:${a}s"></span>`;
  }
  return h + '</div>';
}
function qr(el, texto, tam = 512) {
  if (!el) return;
  const desenha = () => {
    if (!el.isConnected) return;
    if (!window.QRCode) return setTimeout(desenha, 300);
    el.innerHTML = '';
    new QRCode(el, { text: texto, width: tam, height: tam, colorDark: '#17324d', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  };
  desenha();
}

/* ---------- comunicação com o script do Google ---------- */
async function apiGet(params = {}) {
  const q = new URLSearchParams({ ...params, _: Date.now() });
  const r = await fetch(CONFIG.SCRIPT_URL + '?' + q, { cache: 'no-store' });
  if (!r.ok) throw new Error('Servidor ' + r.status);
  const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Erro'); return j;
}
async function apiPost(obj) {
  // sem cabeçalho Content-Type → requisição simples (evita bloqueio de CORS)
  const r = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(obj) });
  if (!r.ok) throw new Error('Servidor ' + r.status);
  const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Erro'); return j;
}

/* ---------- fila de envio (guarda no aparelho até conseguir enviar) ---------- */
const Fila = {
  db: null,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('album-thales-fila', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('fila', { keyPath: 'chave' });
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async op(modo, fn) {
    const db = await this.abrir();
    return new Promise((res, rej) => {
      const tx = db.transaction('fila', modo); const st = tx.objectStore('fila');
      const req = fn(st); tx.oncomplete = () => res(req?.result); tx.onerror = () => rej(tx.error);
    });
  },
  todos() { return this.op('readonly', st => st.getAll()).then(l => (l || []).sort((a, b) => a.criado - b.criado)); },
  por(item) { return this.op('readwrite', st => st.put(item)); },
  tirar(chave) { return this.op('readwrite', st => st.delete(chave)); }
};
let filaCache = [];

function carregarImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function lerBase64(blob) {
  return new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(blob); });
}
async function preparar(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await carregarImg(url);
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    const k = Math.min(1, CONFIG.LADO_MAX / Math.max(w0, h0));
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const dados = c.toDataURL('image/jpeg', CONFIG.QUALIDADE).split(',')[1];
    const kt = 200 / Math.max(w, h); const t = document.createElement('canvas');
    t.width = Math.round(w * kt); t.height = Math.round(h * kt);
    t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    return { mime: 'image/jpeg', dados, w, h, mini: t.toDataURL('image/jpeg', 0.7) };
  } catch {
    // formato que o navegador não abre (ex.: HEIC no Android): envia o arquivo original
    if (file.size > 15e6) throw new Error('Foto grande demais');
    return { mime: file.type || 'image/jpeg', dados: await lerBase64(file), w: 0, h: 0, mini: '' };
  } finally { URL.revokeObjectURL(url); }
}

async function adicionarFotos(files) {
  const nome = local.get('nome', '');
  const recado = ($('#recado')?.value || '').trim();
  let n = 0;
  for (const f of files) {
    if (!/^image\//.test(f.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)) continue;
    try {
      const p = await preparar(f);
      await Fila.por({ chave: uid(), criado: Date.now() + n, nome, recado, tentativas: 0, ...p });
      n++;
    } catch (e) { toast('Não conseguimos abrir uma das fotos. Tente outra.'); }
  }
  if (!n) return;
  if ($('#recado')) { $('#recado').value = ''; recadoAberto = false; desenharRecado(); }
  await renderFila();
  processar();
}

let enviando = false, esperaRetry = null;
async function processar() {
  if (enviando || !configurado()) return;
  enviando = true; clearTimeout(esperaRetry);
  let falhou = false, enviadas = 0;
  try {
    for (;;) {
      const itens = await Fila.todos();
      const prox = itens.find(i => !i.pausada);
      if (!prox) break;
      prox.status = 'enviando'; filaCache = itens; desenharFila();
      try {
        const r = await apiPost({ acao: 'enviar', chave: prox.chave, nome: prox.nome, recado: prox.recado, mime: prox.mime, dados: prox.dados, w: prox.w, h: prox.h });
        const meus = local.get('meus', []); meus.unshift({ id: r.foto.id, t: r.foto.t, mini: prox.mini || '' }); local.set('meus', meus);
        await Fila.tirar(prox.chave); enviadas++;
      } catch (e) {
        prox.tentativas = (prox.tentativas || 0) + 1; prox.status = ''; prox.erro = navigator.onLine ? e.message : 'Sem internet';
        if (prox.tentativas >= 6 || /grande demais|vazia/i.test(e.message)) prox.pausada = true;
        await Fila.por(prox); falhou = true; break;
      }
    }
  } finally {
    enviando = false;
    await renderFila();
    if (enviadas) { toast(enviadas > 1 ? `${enviadas} fotos enviadas para o álbum` : 'Foto enviada para o álbum'); renderGrade(); }
    if (falhou) esperaRetry = setTimeout(processar, 8000);
  }
}
window.addEventListener('online', processar);

    ? `<div class="quem"><div class="avatar" aria-hidden="true">${esc(nome.trim()[0].toUpperCase())}</div>
        <div class="txt">Suas fotos vão com o nome<b>${esc(nome)}</b></div>
        <button class="btn-txt" data-trocar-nome>Trocar</button></div>`
    : `<div class="field">
        <label for="nome">Como você se chama?</label>
        <div class="linhaNome"><input id="nome" maxlength="40" placeholder="Ex.: Tia Ana" autocomplete="given-name" enterkeyhint="done"><button data-salvar-nome>Salvar</button></div>
        <span class="hint">Aparece junto com as suas fotos no telão.</span>
      </div>`;
}
function desenharRecado() {
  const el = $('#blocoRecado'); if (!el) return;
  const valor = $('#recado')?.value || '';
  el.innerHTML = recadoAberto
    ? `<button data-recado aria-expanded="true">${ic('menos')}Recado para o Thales</button>
       <div class="field"><textarea id="recado" maxlength="140" placeholder="Ex.: Parabéns, campeão!" aria-label="Recado para o Thales">${esc(valor)}</textarea>
       <span class="hint">Vai junto com a próxima foto que você enviar.</span></div>`
    : `<button data-recado aria-expanded="false">${ic('mais')}Deixar um recado com a foto</button>`;
}
function desenharAbas() {
  const el = $('#abas'); if (!el) return;
  const nMeus = local.get('meus', []).length;
  el.innerHTML = `
    <button role="tab" data-aba="minhas" aria-selected="${aba === 'minhas'}">Minhas fotos${nMeus ? `<span class="n">${nMeus}</span>` : ''}</button>
    <button role="tab" data-aba="todas" aria-selected="${aba === 'todas'}">Da festa${albumCache.length ? `<span class="n">${albumCache.length}</span>` : ''}</button>`;
}
async function renderFila() {
  try { filaCache = await Fila.todos(); } catch { filaCache = []; }
  desenharFila();
}
function desenharFila() {
  const el = $('#fila'); if (!el) return;
  el.innerHTML = filaCache.map(i => `
    <div class="item ${i.pausada ? 'erro' : ''}">
      ${i.mini ? `<img src="${i.mini}" alt="">` : '<div class="ph"></div>'}
      <div class="txt">
        ${i.pausada ? `Não foi possível enviar. Toque em tentar de novo.`
          : i.status === 'enviando' ? 'Enviando…' : i.erro ? 'Sem conexão. Vamos tentar de novo sozinhos.' : 'Na fila para enviar'}
        ${!i.pausada ? '<div class="barra"><i></i></div>' : ''}
      </div>
      ${i.pausada ? `<button class="btn-icone" data-retentar="${i.chave}" aria-label="Tentar de novo">${ic('refazer')}</button>
                     <button class="btn-icone" data-descartar="${i.chave}" aria-label="Descartar foto">${ic('x')}</button>` : ''}
    </div>`).join('');
}
const vazio = (icone, txt) => `<div class="vazio">${ic(icone, '')}${txt}</div>`;
function renderGrade() {
  const el = $('#grade'); if (!el) return;
  desenharAbas();
  if (aba === 'minhas') {
    const meus = local.get('meus', []);
    el.innerHTML = meus.length
      ? `<div class="grade">${meus.map((m, i) => `<button class="ft" data-ver="minhas:${i}" aria-label="Ver foto">${imgTag(m.id, 400, '', m.mini)}</button>`).join('')}</div>`
      : vazio('peixe', 'Você ainda não enviou fotos.<br>Toque em <b>Tirar foto</b> para começar.');
  } else {
    if (!albumCarregado) el.innerHTML = vazio('concha', 'Carregando o álbum…');
    else desenharAlbum();
    carregarAlbum();
  }
}
function desenharAlbum() {
  const el = $('#grade'); if (!el || aba !== 'todas') return;
  el.innerHTML = albumCache.length
    ? `<div class="grade">${albumCache.map((f, i) => `<button class="ft" data-ver="todas:${i}" aria-label="Foto de ${esc(f.nome)}">${imgTag(f.id, 400)}<span class="selo">${esc(f.nome)}</span></button>`).join('')}</div>`
    : vazio('concha', 'Ninguém enviou fotos ainda.<br>Que tal ser a primeira pessoa?');
}
async function carregarAlbum() {
  if (!configurado()) { albumCarregado = true; return aba === 'todas' && desenharAlbum(); }
  try {
    const r = await apiGet();
    const antes = albumCache.map(f => f.id).join();
    albumCache = r.fotos.slice().reverse(); albumCarregado = true;
    desenharAbas();
    if (albumCache.map(f => f.id).join() !== antes || !$('#grade .grade')) desenharAlbum();
  } catch (e) {
    if (aba === 'todas' && !albumCache.length) $('#grade').innerHTML = vazio('concha', 'Não conseguimos carregar o álbum agora.<br>Verifique a internet e tente de novo.');
  }
}

/* visualizador de foto */
let lb = null;
function abrirLb(lista, i) { if (i < 0) return; lb = { lista, i }; desenharLb(); }
function fecharLb() { lb = null; $('#lb')?.remove(); }
function desenharLb() {
  $('#lb')?.remove(); if (!lb) return;
  const f = lb.lista[lb.i];
  const d = document.createElement('div'); d.className = 'lb'; d.id = 'lb'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Foto');
  d.innerHTML = `
    <div class="barraLb"><span>${lb.i + 1} de ${lb.lista.length}</span><button class="btn-icone" data-lb="fechar" aria-label="Fechar">${ic('x')}</button></div>
    <div class="foto" data-lb="fechar">${imgTag(f.id, 1600, 'loading="eager"', f.mini || '')}</div>
    <div class="info">${f.nome ? `<b>${esc(f.nome)}</b>` : ''}${f.recado ? `<span>“${esc(f.recado)}”</span>` : ''}</div>
    <div class="navLb"><button data-lb="ant" ${lb.i === 0 ? 'disabled' : ''}>${ic('voltar')}Anterior</button><button data-lb="prox" ${lb.i >= lb.lista.length - 1 ? 'disabled' : ''}>Próxima${ic('avancar')}</button></div>`;
  document.body.appendChild(d);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lb]'); if (!b || !lb) return;
  if (b.dataset.lb === 'fechar' && (e.target === b || b.tagName === 'BUTTON')) fecharLb();
  if (b.dataset.lb === 'ant' && lb.i > 0) { lb.i--; desenharLb(); }
  if (b.dataset.lb === 'prox' && lb.i < lb.lista.length - 1) { lb.i++; desenharLb(); }
});
document.addEventListener('keydown', e => {
  if (!lb) return;
  if (e.key === 'Escape') fecharLb();
  if (e.key === 'ArrowLeft' && lb.i > 0) { lb.i--; desenharLb(); }
  if (e.key === 'ArrowRight' && lb.i < lb.lista.length - 1) { lb.i++; desenharLb(); }
});

/* eventos da tela do convidado (delegação) */
function salvarNome() {
  const v = ($('#nome')?.value || '').trim();
  if (!v) { $('#nome')?.focus(); return toast('Escreva seu nome para continuar'); }
  local.set('nome', v); $('#blocoNome').innerHTML = blocoNome(v);
  // atualiza o nome das fotos que ainda estão na fila
  Fila.todos().then(l => Promise.all(l.filter(i => !i.nome).map(i => Fila.por({ ...i, nome: v })))).then(processar);
}
document.addEventListener('click', async e => {
  if (location.hash && location.hash !== '#') return;
  const t = e.target;
  if (t.closest('[data-pede-nome]') && !local.get('nome', '')) {
    const v = ($('#nome')?.value || '').trim();
    if (v) salvarNome();
    else { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); $('#nome')?.focus(); return toast('Antes, conte como você se chama'); }
  }
  if (t.closest('[data-salvar-nome]')) return salvarNome();
  if (t.closest('[data-trocar-nome]')) { local.set('nome', ''); $('#blocoNome').innerHTML = blocoNome(''); return $('#nome').focus(); }
  if (t.closest('[data-recado]')) { recadoAberto = !recadoAberto; desenharRecado(); if (recadoAberto) $('#recado')?.focus(); return; }
  const ab = t.closest('[data-aba]');
  if (ab) { aba = ab.dataset.aba; return renderGrade(); }
  const ver = t.closest('[data-ver]');
  if (ver) {
    const [qual, i] = ver.dataset.ver.split(':');
    return abrirLb(qual === 'minhas' ? local.get('meus', []) : albumCache, +i);
  }
  const re = t.closest('[data-retentar]');
  if (re) { const l = await Fila.todos(); const it = l.find(x => x.chave === re.dataset.retentar);
    if (it) { await Fila.por({ ...it, pausada: false, tentativas: 0, erro: '' }); processar(); } return; }
  const de = t.closest('[data-descartar]');
  if (de) {
    const l = await Fila.todos(); const it = l.find(x => x.chave === de.dataset.descartar); if (!it) return;
    await Fila.tirar(it.chave); renderFila();
    toast('Foto descartada', async () => { await Fila.por(it); renderFila(); });
  }
});
document.addEventListener('keydown', e => { if (e.target.id === 'nome' && e.key === 'Enter') { e.preventDefault(); salvarNome(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'camera' || e.target.id === 'galeria') {
    const files = [...e.target.files]; e.target.value = '';
    if (files.length) { toast(files.length > 1 ? `Preparando ${files.length} fotos…` : 'Preparando a foto…', null, 1500); adicionarFotos(files); }
  }
});

/* ---------- telão ---------- */
const T = { fotos: [], conhecidas: new Set(), novas: [], ciclo: [], camada: 0, rodando: false, wake: null };
function telao() {
  document.body.className = 'telao sem-barra';
  $('#app').innerHTML = `
    <div class="tl" id="tl">
      <div class="luz"></div>
      ${bolhas(14)}
      <div class="marca">${vigia()}<div><h1>Álbum do Thales</h1><small>2 anos · ${esc(CONFIG.DATA_FESTA)}</small></div></div>
      <div class="contador" id="contador" hidden></div>
      <div class="palco"><div class="camada" id="c0"></div><div class="camada" id="c1"></div></div>
      <div class="qrbox" id="qrbox" hidden><div class="qr" id="qrPeq"></div><b>Mande sua foto</b><small>Aponte a câmera do celular</small></div>
      <div class="vazioTl" id="vazioTl" hidden>
        <div class="txt"><h2>Tire uma foto e mande pro álbum do Thales</h2><p>Aponte a câmera do celular para o código. Sua foto aparece aqui na tela.</p></div>
        <div class="qrG" id="qrGrande"></div>
      </div>
      <div class="iniciar" id="iniciar"><div class="caixa">${vigia()}<button>Iniciar telão</button><p>Entra em tela cheia e mantém a tela acesa</p></div></div>
      <button class="sair" onclick="location.hash=''">${ic('sair')}Sair do telão</button>
    </div>
    ${configurado() ? '' : '<div class="aviso" style="position:fixed;top:0;left:0;right:0;z-index:20">Falta a SCRIPT_URL no index.html</div>'}`;
  qr($('#qrPeq'), linkConvidado()); qr($('#qrGrande'), linkConvidado());
  $('#iniciar').addEventListener('click', iniciarTelao);
  buscarTelao(T.conhecidas.size === 0);
}
async function iniciarTelao() {
  $('#iniciar')?.remove();
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.(); } catch {}
  manterAcesa();
  T.rodando = true;
  timers.push(setInterval(() => buscarTelao(false), CONFIG.ATUALIZA_SEGUNDOS * 1000));
  proximaFoto();
}
async function manterAcesa() { try { T.wake = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && T.rodando && location.hash === '#telao') manterAcesa(); });
async function buscarTelao(primeira) {
  if (!configurado()) return atualizarVazio();
  try {
    const r = await apiGet();
    const visiveis = new Set(r.fotos.map(f => f.id));
    T.fotos = r.fotos;
    T.ciclo = T.ciclo.filter(f => visiveis.has(f.id));   // tira fotos que os pais ocultaram
    T.novas = T.novas.filter(f => visiveis.has(f.id));
    for (const f of r.fotos) {
      if (T.conhecidas.has(f.id)) continue;
      T.conhecidas.add(f.id);
      if (!primeira) T.novas.push({ ...f, nova: true });
    }
  } catch {}
  atualizarVazio();
}
function atualizarVazio() {
  const tem = T.fotos.length > 0;
  if ($('#vazioTl')) $('#vazioTl').hidden = tem;
  if ($('#qrbox')) $('#qrbox').hidden = !tem;
  const c = $('#contador'); if (c) { c.hidden = !tem; c.textContent = plural(T.fotos.length, 'foto', 'fotos'); }
  if (!tem) document.querySelectorAll('.camada').forEach(x => x.classList.remove('vis'));
}
function embaralhar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function proximaFoto() {
  if (!T.rodando || location.hash !== '#telao') return;
  let f = T.novas.shift();
  if (!f) {
    if (!T.ciclo.length) T.ciclo = embaralhar(T.fotos.slice());
    f = T.ciclo.shift();
  }
  if (!f) { timers.push(setTimeout(proximaFoto, 3000)); return; }
  const largura = Math.min(2560, Math.round(Math.max(screen.width, screen.height) * (devicePixelRatio || 1)));
  let src = imgUrl(f.id, largura);
  try { await carregarImg(src); }
  catch {
    src = imgUrl2(f.id, largura);
    try { await carregarImg(src); }
    catch {
      // foto recém-enviada: o Drive pode levar alguns segundos para gerar a imagem
      if (f.nova && (f.tent || 0) < 5) { f.tent = (f.tent || 0) + 1; T.novas.push(f); }
      timers.push(setTimeout(proximaFoto, 1500)); return;
    }
  }
  if (!T.rodando || location.hash !== '#telao') return;
  T.camada = 1 - T.camada;
  const el = $('#c' + T.camada), velho = $('#c' + (1 - T.camada));
  const rot = (Math.random() * 3 - 1.5).toFixed(2);
  el.innerHTML = `
    <figure class="polaroid" style="--rot:${rot}deg;margin:0">
      <img src="${src}" alt="">
      <figcaption class="leg">
        ${f.nome ? `<span class="nome">${esc(f.nome)}</span>` : ''}
        <span class="msg">${f.recado ? '“' + esc(f.recado) + '”' : ''}</span>
        ${f.nova ? '<span class="nova">Acabou de chegar</span>' : ''}
      </figcaption>
    </figure>`;
  requestAnimationFrame(() => { el.classList.add('vis'); velho.classList.remove('vis'); });
  timers.push(setTimeout(proximaFoto, CONFIG.TROCA_SEGUNDOS * 1000 + (f.nova ? 3000 : 0)));
}

/* ---------- área dos pais ---------- */
let paisDados = null, filtroPais = 'todas';
function pais() {
  document.body.className = 'sem-barra';
  const pin = sessionStorage.getItem('album-pin');
  if (!pin) {
    $('#app').innerHTML = `
      ${avisoConfig()}
      <div class="login">
        ${vigia()}
        <h1>Área dos pais</h1>
        <p>Digite o PIN para ver e organizar as fotos.</p>
        <form id="formPin">
          <div class="field"><label for="pin" class="sr">PIN</label>
            <input id="pin" type="password" inputmode="numeric" autocomplete="off" required aria-describedby="pinErro">
            <span class="hint" id="pinErro" style="color:var(--err);text-align:center" aria-live="polite"></span></div>
          <button>Entrar</button>
          <a class="btn btn-txt" href="#">Voltar ao álbum</a>
        </form>
      </div>`;
    $('#pin').focus();
    $('#formPin').addEventListener('submit', async e => {
      e.preventDefault();
      const v = $('#pin').value.trim(), btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Entrando…'; $('#pinErro').textContent = '';
      try { await apiGet({ pin: v }); sessionStorage.setItem('album-pin', v); pais(); }
      catch (err) {
        $('#pinErro').textContent = err.message === 'PIN incorreto' ? 'PIN incorreto. Confira e tente de novo.' : 'Sem conexão com o álbum. Tente de novo.';
        btn.disabled = false; btn.textContent = 'Entrar'; $('#pin').select();
      }
    });
    return;
  }
  $('#app').innerHTML = `
    <header class="cab"><a class="btn-icone btn" href="#" aria-label="Voltar ao álbum">${ic('voltar')}</a><h1>Área dos pais</h1>
      <button class="btn-txt" data-pais="sair">Sair</button></header>
    ${avisoConfig()}
    <main class="pais">
      <div class="kpis">
        <div><div class="kpi" id="sTotal">–</div><div class="kpi-label">Fotos</div></div>
        <div><div class="kpi" id="sPessoas">–</div><div class="kpi-label">Pessoas</div></div>
        <div><div class="kpi" id="sOcultas">–</div><div class="kpi-label">Ocultas</div></div>
      </div>
      <div class="acoesPais">
        <a class="btn" id="abrirPasta" target="_blank" rel="noopener" href="#">${ic('pasta')}Abrir pasta no Drive (baixar tudo)</a>
        <div class="linha">
          <a class="btn btn-sec" href="#telao">${ic('tv')}Telão</a>
          <a class="btn btn-sec" href="#qr">${ic('qr')}QR das mesas</a>
          <button class="btn btn-sec" data-pais="compartilhar">${ic('link')}Enviar link</button>
        </div>
      </div>
      <div class="group-title"><span>Fotos recebidas</span>
        <div class="chips">
          <button class="chip" data-filtro="todas" aria-pressed="${filtroPais === 'todas'}">Todas</button>
          <button class="chip" data-filtro="ocultas" aria-pressed="${filtroPais === 'ocultas'}">Ocultas</button>
        </div></div>
      <div class="gradePais" id="gradePais">${vazio('concha', 'Carregando…')}</div>
    </main>`;
  carregarPais();
  timers.push(setInterval(() => !document.hidden && carregarPais(), 30000));
}
async function carregarPais() {
  const pin = sessionStorage.getItem('album-pin');
  try { paisDados = await apiGet({ pin }); desenharPais(); }
  catch (e) {
    if (e.message === 'PIN incorreto') { sessionStorage.removeItem('album-pin'); return pais(); }
    if (!paisDados) $('#gradePais').innerHTML = vazio('concha', 'Não conseguimos carregar as fotos. Verifique a internet.');
  }
}
function desenharPais() {
  if (!paisDados || !$('#gradePais')) return;
  const todas = paisDados.fotos.slice().reverse();
  $('#sTotal').textContent = todas.length.toLocaleString('pt-BR');
  $('#sPessoas').textContent = new Set(todas.map(f => f.nome)).size.toLocaleString('pt-BR');
  $('#sOcultas').textContent = todas.filter(f => f.oculta).length.toLocaleString('pt-BR');
  if (paisDados.pastaUrl) $('#abrirPasta').href = paisDados.pastaUrl;
  document.querySelectorAll('[data-filtro]').forEach(b => b.setAttribute('aria-pressed', b.dataset.filtro === filtroPais));
  const fotos = filtroPais === 'ocultas' ? todas.filter(f => f.oculta) : todas;
  $('#gradePais').innerHTML = fotos.length ? fotos.map(f => `
    <div class="tp ${f.oculta ? 'oculta' : ''}">
      <button class="ft" data-pais-ver="${esc(f.id)}" aria-label="Ver foto de ${esc(f.nome)}">${imgTag(f.id, 400)}</button>
      <div class="rod">
        <div class="txt"><b>${esc(f.nome)}</b>${hora(f.t)}${f.recado ? ' · ' + esc(f.recado) : ''}</div>
        <button class="btn-icone" data-ocultar="${esc(f.id)}" data-estado="${f.oculta ? 1 : 0}" aria-label="${f.oculta ? 'Mostrar no telão' : 'Ocultar do telão'}" title="${f.oculta ? 'Mostrar no telão' : 'Ocultar do telão'}">${ic(f.oculta ? 'olhoFechado' : 'olho')}</button>
        <a class="btn-icone btn" href="https://drive.google.com/uc?export=download&id=${encodeURIComponent(f.id)}" target="_blank" rel="noopener" aria-label="Baixar foto" title="Baixar foto">${ic('baixar')}</a>
      </div>
    </div>`).join('')
    : `<div style="grid-column:1/-1">${vazio('concha', filtroPais === 'ocultas' ? 'Nenhuma foto oculta.' : 'Nenhuma foto ainda. Elas aparecem aqui assim que os convidados enviarem.')}</div>`;
}
async function ocultar(id, oculta) {
  const f = paisDados?.fotos.find(x => x.id === id); if (f) { f.oculta = oculta; desenharPais(); }  // resposta imediata
  try { await apiPost({ acao: 'ocultar', pin: sessionStorage.getItem('album-pin'), id, oculta }); return true; }
  catch (err) { if (f) { f.oculta = !oculta; desenharPais(); } toast('Não deu certo. Tente de novo.'); return false; }
}
document.addEventListener('click', async e => {
  if (location.hash !== '#pais') return;
  const t = e.target;
  const acao = t.closest('[data-pais]')?.dataset.pais;
  if (acao === 'sair') { sessionStorage.removeItem('album-pin'); location.hash = ''; return; }
  if (acao === 'compartilhar') {
    const url = linkConvidado();
    try { if (navigator.share) await navigator.share({ title: 'Álbum do Thales', text: 'Mande suas fotos da festa do Thales!', url }); else { await navigator.clipboard.writeText(url); toast('Link copiado'); } } catch {}
    return;
  }
  const fi = t.closest('[data-filtro]');
  if (fi) { filtroPais = fi.dataset.filtro; return desenharPais(); }
  const oc = t.closest('[data-ocultar]');
  if (oc) {
    const id = oc.dataset.ocultar, vaiOcultar = oc.dataset.estado !== '1';
    if (await ocultar(id, vaiOcultar)) toast(vaiOcultar ? 'Foto oculta do telão' : 'Foto de volta no telão', () => ocultar(id, !vaiOcultar));
    return;
  }
  const v = t.closest('[data-pais-ver]');
  if (v && paisDados) { const l = paisDados.fotos.slice().reverse(); abrirLb(l, l.findIndex(f => f.id === v.dataset.paisVer)); }
});

/* ---------- cartão do QR para imprimir ---------- */
function paginaQr() {
  document.body.className = 'sem-barra';
  $('#app').innerHTML = `
    <div class="folha">
      <div class="naoimprime" style="display:flex;gap:8px;margin-bottom:16px;align-items:center">
        <a class="btn btn-txt" href="#pais">${ic('voltar')}Voltar</a><span style="flex:1"></span><button onclick="print()">Imprimir</button>
      </div>
      <div class="cartao">
        ${vigia()}
        <h2>Álbum do Thales</h2>
        <p class="sub">2 anos · ${esc(CONFIG.DATA_FESTA)}</p>
        <p class="passo">Aponte a câmera do celular, tire fotos da festa e envie. Elas aparecem no telão.</p>
        <div class="qrPrint" id="qrPrint"></div>
        <div class="url">${esc(linkConvidado())}</div>
      </div>
    </div>`;
  qr($('#qrPrint'), linkConvidado());
}

/* ---------- início ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
document.title = CONFIG.APP_NAME;
render();
processar();
</script>
